<header class="topbar">
  <p-toolbar>
    <ng-template #start><p-button icon="pi pi-plus" class="mr-2" severity="secondary" ariaLabel="Agregar" /><p-button
        icon="pi pi-print" class="mr-2" severity="secondary" ariaLabel="Imprimir" /><p-button icon="pi pi-upload"
        severity="secondary" ariaLabel="Subir" /></ng-template>
    <ng-template #center><p-iconfield iconPosition="left"><p-inputicon class="pi pi-search" /><input type="text"
          pInputText placeholder="Buscar" /></p-iconfield></ng-template>
    <ng-template #end><label class="theme-switch"
        [attr.aria-label]="isDarkTheme ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"><i class="pi"
          [class.pi-sun]="!isDarkTheme" [class.pi-moon]="isDarkTheme"></i><input type="checkbox" [checked]="isDarkTheme"
          (change)="toggleTheme()" /><span class="theme-switch-track" aria-hidden="true"></span><span
          class="theme-switch-label">{{ isDarkTheme ? 'Oscuro' : 'Claro' }}</span></label><p-button icon="pi pi-cog"
        severity="secondary" ariaLabel="Configuracion" title="Configuracion" />
      <p-splitbutton label="Save" [model]="items" appendTo="body"></p-splitbutton>
    </ng-template>
  </p-toolbar>
</header>

<main class="app-layout">
  <aside class="sidebar-shell">
    <div class="brand"><i class="pi pi-briefcase"></i><span>SMALL<span>PROFESIONAL</span></span></div>
    <nav class="sidebar-navigation" aria-label="Menu principal"><p-panelmenu [model]="items" [multiple]="true"
        styleClass="service-panel-menu"></p-panelmenu></nav>
    <footer class="user-area">
      <div class="user-profile"><p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
          shape="circle" />
        <div><strong>Usuario Usuario</strong><small>Admin</small> <small>Empresa</small><small>Licencia Basica</small>
        </div>
      </div>
      <div class="user-actions"><button type="button" (click)="lockApp()"><i class="pi pi-lock"></i>Bloquear
          app</button><button type="button" class="logout" (click)="logout()"><i class="pi pi-sign-out"></i> Cerrar
          sesion</button></div>
      <div class="center" align="center"><small>32NG Dev Team & Doña ChayoGPT</small></div>
    </footer>
  </aside>
  <section class="content-area"><ng-content></ng-content></section>
</main>
